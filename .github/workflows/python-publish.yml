# Publishing is intentionally disabled. Remove the false job guards only after
# configuring the protected "pypi" environment and a PyPI trusted publisher for
# microsoft/msticpy, python-publish.yml, and the "pypi" environment.
# The environment must require approval and restrict deployments to release tags.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package to PyPI Prod

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ false && github.event_name == 'release' &&
          !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
    - name: Build package
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
    - name: Upload distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-distributions
        path: dist/
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build
    if: >-
      ${{ false && needs.build.result == 'success' &&
          github.event_name == 'release' && !github.event.release.prerelease &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msticpy
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-distributions
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
